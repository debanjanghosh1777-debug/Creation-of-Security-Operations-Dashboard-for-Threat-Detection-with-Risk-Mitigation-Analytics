{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-body">

<h2>Change Password</h2>

<form method="POST">

<input
type="password"
name="old_password"
placeholder="Current Password"
class="form-control mb-3"
required>

<input
type="password"
name="new_password"
placeholder="New Password"
class="form-control mb-3"
required>

<button class="btn btn-primary">

Change Password

</button>

</form>

</div>

</div>

</div>

{% endblock %}
