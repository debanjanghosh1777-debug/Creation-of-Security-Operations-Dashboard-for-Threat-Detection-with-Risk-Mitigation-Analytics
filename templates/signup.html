<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AI Threat Detection System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <style>

        body{
            margin:0;
            padding:0;
            background:#0b1220;
            font-family:Arial, Helvetica, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .signup-container{

            width:420px;

            background:#111827;

            padding:35px;

            border-radius:18px;

            box-shadow:0 0 30px rgba(0,255,255,.25);

            color:white;

        }

        .logo{

            text-align:center;

            margin-bottom:20px;

        }

        .logo img{

            width:90px;

            margin-bottom:10px;

        }

        .logo h2{

            margin:0;

            color:#00e5ff;

        }

        .logo p{

            color:#9ca3af;

            font-size:14px;

        }

        .form-group{

            margin-bottom:18px;

        }

        .form-group label{

            display:block;

            margin-bottom:8px;

            font-size:14px;

            color:#cbd5e1;

        }

        .form-group input{

            width:100%;

            padding:12px;

            border:none;

            border-radius:10px;

            background:#1f2937;

            color:white;

            outline:none;

            font-size:15px;

        }

        .form-group input:focus{

            border:1px solid #00e5ff;

        }

        .register-btn{

            width:100%;

            padding:14px;

            background:#00bcd4;

            border:none;

            border-radius:10px;

            color:white;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;

            transition:.3s;

        }

        .register-btn:hover{

            background:#0891b2;

        }

        .login-link{

            text-align:center;

            margin-top:18px;

            color:#cbd5e1;

        }

        .login-link a{

            color:#00e5ff;

            text-decoration:none;

            font-weight:bold;

        }

        .login-link a:hover{

            text-decoration:underline;

        }

        .error{

            background:#7f1d1d;

            padding:10px;

            border-radius:8px;

            margin-bottom:15px;

            text-align:center;

        }

        .success{

            background:#14532d;

            padding:10px;

            border-radius:8px;

            margin-bottom:15px;

            text-align:center;

        }

    </style>

</head>

<body>

<div class="signup-container">

    <div class="logo">

        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">

        <h2>AI Threat Detection</h2>

        <p>Create Your Account</p>

    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}

                <div class="{{ category }}">
                    {{ message }}
                </div>

            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="form-group">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

        </div>

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >

        </div>

        <button class="register-btn" type="submit">

            Create Account

        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="{{ url_for('login') }}">

            Login Here

        </a>

    </div>

</div>

</body>

</html>
