{% extends "layout.html" %}

{% block content %}

<div class="dashboard-wrapper">

    <!-- Header -->

    <div class="hero-section">

        <div class="hero-left">

            <h1>System Settings</h1>

            <p>

                Configure AI Threat Detection System preferences.

            </p>

        </div>

        <div class="hero-right">

            <i class="fas fa-cogs fa-5x"></i>

        </div>

    </div>

    <div class="chart-grid">

        <!-- Profile -->

        <div class="chart-card">

            <div class="card-header">

                <h3>

                    <i class="fas fa-user"></i>

                    Profile

                </h3>

            </div>

            <form>

                <label>Username</label>

                <input
                    type="text"
                    value="{{ user }}"
                    readonly>

                <label>Role</label>

                <input
                    type="text"
                    value="{{ role }}"
                    readonly>

            </form>

        </div>

        <!-- AI Settings -->

        <div class="chart-card">

            <div class="card-header">

                <h3>

                    <i class="fas fa-robot"></i>

                    AI Engine

                </h3>

            </div>

            <label>

                <input type="checkbox" checked>

                Enable AI Detection

            </label>

            <br><br>

            <label>

                <input type="checkbox" checked>

                Enable Threat Intelligence

            </label>

            <br><br>

            <label>

                <input type="checkbox">

                Auto Scan Uploaded Files

            </label>

        </div>

        <!-- Notifications -->

        <div class="chart-card">

            <div class="card-header">

                <h3>

                    <i class="fas fa-bell"></i>

                    Notifications

                </h3>

            </div>

            <label>

                <input type="checkbox" checked>

                Email Alerts

            </label>

            <br><br>

            <label>

                <input type="checkbox" checked>

                Browser Notifications

            </label>

            <br><br>

            <label>

                <input type="checkbox">

                Critical Alerts Only

            </label>

        </div>

        <!-- Appearance -->

        <div class="chart-card">

            <div class="card-header">

                <h3>

                    <i class="fas fa-palette"></i>

                    Appearance

                </h3>

            </div>

            <select>

                <option selected>Cyber Dark</option>

                <option>Dark Blue</option>

                <option>Light</option>

            </select>

            <br><br>

            <button
                class="primary-btn"
                onclick="saveSettings();return false;">

                Save Settings

            </button>

        </div>

    </div>

</div>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/settings.css') }}">

<script src="{{ url_for('static', filename='js/settings.js') }}"></script>

{% endblock %}
